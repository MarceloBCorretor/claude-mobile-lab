<head>

<title>Felipe vs Zumbi | Pinball</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:#06140b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#1d4a2c 0,#06140b 72%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#game{position:relative;width:min(100vw,62.5dvh);height:100dvh;overflow:hidden;isolation:isolate;touch-action:none;container-type:size;background:#244f27}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:absolute;inset:0;z-index:2;touch-action:none}
/* cabeçalho e rodapé: mesma altura, mesmas margens */
#top,#footer{position:absolute;z-index:6;left:1.4cqw;right:1.4cqw;border-radius:4cqw;background:linear-gradient(#1b2530f0,#0b1218f5);border:.5cqw solid #ffffff26}
#top{top:calc(env(safe-area-inset-top) + 1.4cqw);height:17.2cqw;padding:1.3cqw 1.6cqw 1.3cqw 1.3cqw;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2.4cqw;box-shadow:0 1cqw 3cqw #0007}
#footer{bottom:calc(env(safe-area-inset-bottom) + 1.4cqw);display:grid;grid-template-columns:repeat(4,1fr);gap:1.3cqw;padding:1.3cqw;box-shadow:0 -1cqw 3cqw #0007}
#left{display:flex;align-items:center;gap:2cqw}
#avatar{width:14cqw;height:14cqw;border-radius:50%;border:.8cqw solid #ffcf3a;box-shadow:0 0 0 .5cqw #0006,0 .8cqw 2cqw #0008;background:#ffd56a;overflow:hidden;flex:none}
#avatar img{width:100%;height:100%;object-fit:cover;display:block}
#stat{display:grid;gap:.9cqw}
#hearts{display:flex;gap:.9cqw}
.heart{width:5cqw;height:5cqw;filter:drop-shadow(0 .3cqw .3cqw #0008)}
#hearts .plus{font-size:3.6cqw;font-weight:1000;color:#ff8a98;align-self:center;margin-left:.2cqw}
#hearts.pop{animation:hp .7s ease-out}
@keyframes hp{0%{transform:scale(1)}30%{transform:scale(1.35);filter:drop-shadow(0 0 2cqw #ff3b4e)}100%{transform:scale(1)}}
#coinrow{display:flex;align-items:center;gap:1.4cqw;background:#0b1218;border-radius:4cqw;padding:.4cqw 2.4cqw .4cqw .6cqw}
.coin{width:5cqw;height:5cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc61a 55%,#c98a08);border:.4cqw solid #8a5a08;display:inline-block;flex:none;box-shadow:inset 0 0 0 .4cqw #ffe47a66}
#coins{font-weight:1000;font-size:5cqw;color:#ffe066;font-variant-numeric:tabular-nums;text-shadow:0 .3cqw 0 #5a3a05}
#wave{min-width:0;text-align:center}
#waveTxt{font-weight:1000;font-size:4.4cqw;letter-spacing:.04em;line-height:1}
#waveTxt b{color:#7dff9a;font-size:5.6cqw;margin-left:.8cqw}
#bar{height:2.4cqw;border-radius:2cqw;background:#0b1218;margin:1.1cqw 0;overflow:hidden;border:.3cqw solid #ffffff22}
#barf{display:block;height:100%;width:0;background:linear-gradient(#ff6a5a,#d41f1f);transition:width .25s}
#zcount{font-weight:900;font-size:3.1cqw;letter-spacing:.03em;line-height:1}
#pauseBtn{width:12cqw;height:12cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2e9a3f,#0f5a22);border:.8cqw solid #7dff9a;box-shadow:0 .8cqw 2cqw #0008,inset 0 0 0 .4cqw #0006;display:grid;place-items:center}
#pauseBtn span{display:flex;gap:1.1cqw}
#pauseBtn i{display:block;width:1.8cqw;height:5cqw;background:#fff;border-radius:.6cqw;box-shadow:0 .3cqw .3cqw #0006}
/* mensagem discreta sob o cabeçalho */
#note{position:absolute;z-index:6;left:50%;top:calc(env(safe-area-inset-top) + 20.4cqw);transform:translateX(-50%);padding:.9cqw 3.2cqw;border-radius:5cqw;background:#0a1410cc;border:.3cqw solid #ffffff26;font-weight:800;font-size:3.1cqw;letter-spacing:.02em;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s;max-width:94cqw;overflow:hidden;text-overflow:ellipsis}
#note.on{opacity:1}
#note.gold{background:linear-gradient(#ffe27acc,#f5a60fcc);color:#4a2a00;border-color:#fff6}
#tag{position:absolute;z-index:6;left:3cqw;top:calc(env(safe-area-inset-top) + 26.4cqw);padding:.7cqw 2.6cqw;border-radius:3cqw;background:linear-gradient(#ffe34a,#ff9b0a);border:.4cqw solid #7a3a00;color:#7a1a00;font-size:3.4cqw;font-weight:1000;transform:rotate(-5deg) scale(.6);opacity:0;pointer-events:none;transition:opacity .15s,transform .2s}
#tag.on{opacity:1;transform:rotate(-5deg) scale(1)}
/* poderes */
.card{position:relative;display:flex;align-items:center;gap:.6cqw;height:14.6cqw;padding:.6cqw .6cqw .6cqw .6cqw;border-radius:2.8cqw;border:.6cqw solid var(--c);background:linear-gradient(140deg,var(--c2),#0b1a12 95%);box-shadow:0 .8cqw 1.6cqw #0008,inset 0 .35cqw 0 #ffffff40;touch-action:none;text-align:left;min-width:0;transition:transform .12s,filter .2s}
.card .ic{width:8.6cqw;height:8.6cqw;object-fit:contain;flex:none;margin-left:-.3cqw;filter:drop-shadow(0 .5cqw .5cqw #0007);pointer-events:none}
.card .tx{min-width:0;flex:1;pointer-events:none}
.card .nm{font-weight:900;font-size:2.45cqw;letter-spacing:-.01em;line-height:1.05;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .3cqw .3cqw #0009}
.card .pr{display:flex;align-items:center;gap:.7cqw;font-weight:1000;font-size:3.9cqw;margin-top:.8cqw;text-shadow:0 .3cqw .3cqw #0009}
.card .pr .coin{width:3.8cqw;height:3.8cqw;border-width:.35cqw}
.card.off{filter:grayscale(.8) brightness(.65)}
.card.armed{transform:translateY(-1.6cqw);box-shadow:0 0 0 .6cqw #fff,0 0 5cqw var(--c)}
.card:active{transform:translateY(.4cqw)}
.pea{--c:#58e05a;--c2:#2a8a2e}.ice{--c:#4fb8ff;--c2:#1d63b8}.bomb{--c:#ff5a5a;--c2:#9e1f2a}.sun{--c:#ffd34a;--c2:#b07a0c}
/* zonas de vidro das alavancas (visuais; o toque vale em cada metade da tela) */
.gz{position:absolute;z-index:3;pointer-events:none;bottom:calc(env(safe-area-inset-bottom) + 18.8cqw);width:30cqw;height:16cqw;border-radius:5cqw;
  background:linear-gradient(160deg,#ffffff22,#ffffff08 60%,#ffffff12);border:.45cqw solid #ffffff38;box-shadow:inset 0 .4cqw 0 #ffffff30;backdrop-filter:blur(1.5px);transition:background .08s,box-shadow .08s;display:grid;place-items:center}
.gz svg{width:8cqw;opacity:.5}
#gzL{left:1.4cqw}#gzR{right:1.4cqw}
.gz.on{background:linear-gradient(160deg,#fff6,#ffffff22);box-shadow:0 0 5cqw #ffe27a99,inset 0 0 3cqw #fff8;border-color:#fff}
.fl{position:absolute;z-index:5;pointer-events:none;font-weight:1000;font-size:4.6cqw;text-shadow:0 .4cqw 0 #000a,0 0 1.6cqw #000;transform:translate(-50%,-50%);animation:fl 1s ease-out forwards;white-space:nowrap}
.fl.big{font-size:6.2cqw}
@keyframes fl{0%{opacity:0;margin-top:0;scale:.5}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-10cqw;scale:1}}
#vig{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,#ff000000 40%,#ff1a1ab0 100%);transition:opacity .5s}
#vig.on{opacity:1;transition:none}
/* telas */
.screen{position:absolute;inset:0;z-index:20;display:none}
.screen.on{display:block}
#menu{background:#58b3e8 url(assets/ui/menu.webp) center/100% 100% no-repeat}
.hot{position:absolute;border-radius:5cqw;background:transparent}
.hot:active{background:#ffffff33}
.hot:disabled{opacity:.5}
.exitm{position:absolute;right:3.5cqw;top:calc(env(safe-area-inset-top) + 3cqw);padding:1.6cqw 3.6cqw;border-radius:4cqw;background:#0008;border:.4cqw solid #ffffff55;font-weight:800;font-size:3.4cqw;color:#fff}
#hJogar{left:19%;top:66%;width:62%;height:12.5%}
#hPers{left:8%;top:79.5%;width:27.5%;height:11%}
#hCen{left:36%;top:79.5%;width:28%;height:11%}
#hSom{left:65%;top:79.5%;width:27.5%;height:11%}
#menuBest{position:absolute;left:0;right:0;top:61.2%;text-align:center;font-weight:900;font-size:3.6cqw;text-shadow:0 .4cqw .8cqw #000,0 0 2cqw #000}
.modalbg{background:#031008e8;overflow-y:auto}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88cqw;max-height:92cqh;overflow:auto;border-radius:6cqw;background:linear-gradient(#1f3a2a,#0f2318);border:.8cqw solid #7dff9a55;padding:5cqw;text-align:center;box-shadow:0 2cqw 8cqw #000c}
.box h2{margin:0 0 2.5cqw;font-size:8cqw;font-weight:1000;color:#ffe46c;text-shadow:0 .6cqw 0 #6b3a05;line-height:1}
.box p{margin:1cqw 0 3cqw;font-size:4cqw;line-height:1.4;color:#e5f5ea}
.btn{display:block;width:100%;border-radius:4cqw;padding:3.6cqw 2cqw;margin-top:2.4cqw;font-weight:1000;font-size:5.2cqw;letter-spacing:.03em;background:linear-gradient(#ffe677,#f5a923);color:#3a2500;box-shadow:0 1cqw 0 #8a591b,0 2cqw 3cqw #0007}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .2cqw 0 #8a591b}
.btn.g{background:#ffffff1c;color:#fff;box-shadow:none;border:.4cqw solid #ffffff40;font-size:4.2cqw;padding:3cqw}
.stars{font-size:11cqw;letter-spacing:1cqw;color:#ffd24a;text-shadow:0 .6cqw 0 #6b3a05}
.stars s{color:#ffffff30;text-decoration:none}
.lv{display:flex;gap:3cqw;align-items:center;width:100%;text-align:left;padding:2.4cqw;border-radius:4cqw;background:#ffffff12;border:.5cqw solid #ffffff2e;margin-top:2cqw}
.lv .th{width:16cqw;height:22cqw;border-radius:2.4cqw;flex:none;background:#2c4a36 center/cover}
.lv b{display:block;font-size:4.4cqw}
.lv small{display:block;font-size:3.1cqw;color:#cfe7d6;margin-top:.8cqw;line-height:1.3}
.lv .st{font-size:4.6cqw;color:#ffd24a;margin-top:1cqw}
.lv.lock{opacity:.55;pointer-events:none}
.sheet{width:100%;border-radius:3cqw;margin-bottom:2cqw}
#noGL{display:none;position:absolute;inset:0;z-index:50;place-items:center;text-align:center;padding:8cqw;background:#06140b;font-weight:800;line-height:1.5}
@media(prefers-reduced-motion:reduce){.fl{animation-duration:.01s}}
</style>
</head>
<body>
<div id="game" aria-label="Felipe vs Zumbi">
  <canvas id="c" aria-label="Mesa de pinball"></canvas>
  <div id="touch"></div>
  <div id="vig"></div>
  <div class="gz" id="gzL"><svg viewBox="0 0 40 40"><path d="M8 30 L30 12" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="8" cy="30" r="5" fill="#fff"/></svg></div>
  <div class="gz" id="gzR"><svg viewBox="0 0 40 40"><path d="M32 30 L10 12" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="30" r="5" fill="#fff"/></svg></div>
  <div id="top">
    <div id="left"><div id="avatar"><img id="face" alt="Felipe" src="assets/felipe/feliz.webp"></div>
      <div id="stat"><div id="hearts"></div><div id="coinrow"><span class="coin"></span><b id="coins">0</b></div></div></div>
    <div id="wave"><div id="waveTxt">ONDA<b id="waveN">1</b></div><div id="bar"><i id="barf"></i></div><div id="zcount">ZUMBIS 0/0</div></div>
    <button id="pauseBtn" aria-label="Pausar"><span><i></i><i></i></span></button>
  </div>
  <div id="note"></div><div id="tag">UPIII!</div>
  <div id="footer"></div>

  <section class="screen on" id="menu" aria-label="Menu principal">
    <div id="menuBest"></div>
    <button class="hot" id="hJogar" aria-label="Jogar"></button><button class="hot" id="hPers" aria-label="Personagens"></button>
    <button class="hot" id="hCen" aria-label="Cenários"></button><button class="hot" id="hSom" aria-label="Som"></button><button id="bExitM" class="exitm" aria-label="Sair do jogo">Sair</button>
  </section>
  <section class="screen modalbg" id="levels"><div class="box"><h2>Cenários</h2><div id="lvList"></div><button class="btn g" data-go="menu">Voltar</button></div></section>
  <section class="screen modalbg" id="chars"><div class="box"><h2>Personagens</h2><img class="sheet" src="assets/ui/personagens.webp" alt="Guia dos personagens"><button class="btn g" data-go="menu">Voltar</button></div></section>
  <section class="screen modalbg" id="pause"><div class="box"><h2>Pausado</h2><button class="btn" id="bResume">CONTINUAR</button><button class="btn g" id="bRestart">Reiniciar fase</button><button class="btn g" id="bQuit">Menu principal</button><button class="btn g" id="bExitP">Sair do jogo</button></div></section>
  <section class="screen modalbg" id="exit"><div class="box"><h2>Sair do jogo?</h2><p>Seu recorde fica salvo.</p><button class="btn" id="exitStay">CONTINUAR JOGANDO</button><button class="btn g" id="exitGo">Sair do jogo</button><p id="exitMsg" style="font-size:3.4cqw;margin:3cqw 0 0"></p></div></section>
  <section class="screen modalbg" id="result"><div class="box"><h2 id="resTitle"></h2><div class="stars" id="resStars"></div><p id="resTxt"></p><button class="btn" id="resMain"></button><button class="btn g" id="resMenu">Menu</button></div></section>
  <div id="noGL"><div>Este aparelho não conseguiu abrir o jogo.</div></div>
</div>
<script src="game.js"></script>
</body>
</html>
