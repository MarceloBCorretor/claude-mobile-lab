<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0b2a14">
<meta name="description" content="Felipe vs Zumbi: pinball 3D com defesa de plantas, fusão e chefões.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icones/icone-192.png">
<title>Felipe vs Zumbi | Pinball 3D</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:#06140b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#1d4a2c 0,#06140b 72%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#game{position:relative;width:min(100vw,62.5dvh);height:100dvh;overflow:hidden;isolation:isolate;touch-action:none;container-type:size;background:#3b8a3a}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#touch{position:absolute;inset:0;z-index:2;touch-action:none}
.hud{position:absolute;z-index:5;pointer-events:none}
/* topo */
#hudL{left:1.5cqw;top:calc(env(safe-area-inset-top) + 1.2cqw);display:flex;align-items:center}
#avatar{position:relative;z-index:2;width:15cqw;height:15cqw;border-radius:50%;border:.9cqw solid #ffcf3a;box-shadow:0 0 0 .6cqw #0006,0 1.2cqw 3cqw #0008;background:#ffd56a;overflow:hidden;flex:none}
#avatar img{width:100%;height:100%;object-fit:cover;display:block}
#panelL{margin-left:-4.2cqw;padding:1.4cqw 2.4cqw 1.4cqw 5.4cqw;border-radius:3cqw;background:linear-gradient(#27333f,#161f29);border:.5cqw solid #0b1218;box-shadow:0 1cqw 2.4cqw #0007,inset 0 .3cqw 0 #ffffff22}
#hearts{display:flex;gap:1.2cqw}
.heart{width:5.4cqw;height:5.4cqw;filter:drop-shadow(0 .4cqw .4cqw #0008)}
#coinrow{display:flex;align-items:center;gap:2cqw;margin-top:1.2cqw;background:#0b1218;border-radius:5cqw;padding:.6cqw 3cqw .6cqw .8cqw}
.coin{width:6.2cqw;height:6.2cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc61a 55%,#c98a08);border:.45cqw solid #8a5a08;display:inline-block;flex:none;box-shadow:inset 0 0 0 .5cqw #ffe47a66}
#coins{font-weight:1000;font-size:5.8cqw;color:#ffe066;font-variant-numeric:tabular-nums;text-shadow:0 .4cqw 0 #5a3a05}
#hudR{right:1.5cqw;top:calc(env(safe-area-inset-top) + 2cqw);display:flex;align-items:center;gap:2cqw}
#panelR{display:flex;align-items:center;gap:2cqw;padding:1.6cqw 3cqw 1.6cqw 2cqw;border-radius:3cqw;background:linear-gradient(#27333f,#161f29);border:.5cqw solid #0b1218;box-shadow:0 1cqw 2.4cqw #0007,inset 0 .3cqw 0 #ffffff22;min-width:37cqw}
#skull{width:8cqw;height:8cqw;flex:none}
#waveTxt{font-weight:1000;font-size:4.8cqw;letter-spacing:.04em;text-align:center}
#waveTxt b{color:#7dff9a;font-size:6.2cqw;margin-left:1cqw}
#bar{height:2.8cqw;border-radius:2cqw;background:#0b1218;margin:1cqw 0;overflow:hidden;border:.35cqw solid #ffffff22}
#barf{height:100%;width:0;background:linear-gradient(#ff6a5a,#d41f1f);transition:width .25s}
#zcount{font-weight:900;font-size:3.3cqw;text-align:center;letter-spacing:.03em}
#panelR .mid{flex:1}
#pauseBtn{pointer-events:auto;width:12cqw;height:12cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2e9a3f,#0f5a22);border:.9cqw solid #7dff9a;box-shadow:0 1cqw 2.4cqw #0008,inset 0 0 0 .5cqw #0006;display:grid;place-items:center}
#pauseBtn i{display:block;width:1.9cqw;height:5.4cqw;background:#fff;border-radius:.6cqw;margin:0 .9cqw;box-shadow:0 .3cqw .3cqw #0006}
#pauseBtn span{display:flex}
/* combo / ouro */
#status{left:0;right:0;top:calc(env(safe-area-inset-top) + 22.5cqw);display:flex;justify-content:center;pointer-events:none;z-index:5;position:absolute}
#goldTag{display:none;padding:.8cqw 3.2cqw;border-radius:5cqw;background:linear-gradient(#ffe27a,#f5a60f);color:#5a3200;font-weight:1000;font-size:3.6cqw;box-shadow:0 0 4cqw #ffb800aa}
#comboTag{padding:.6cqw 3cqw;border-radius:5cqw;background:#0b1218cc;border:.4cqw solid #ffffff2e;font-weight:900;font-size:3.4cqw;color:#bfe9ff}
#comboTag b{color:#fff}
/* rodapé: 4 poderes numa única barra */
#footer{position:absolute;z-index:6;left:1.4cqw;right:1.4cqw;bottom:calc(env(safe-area-inset-bottom) + 1.4cqw);display:grid;grid-template-columns:repeat(4,1fr);gap:1.3cqw;padding:1.3cqw;border-radius:4cqw;background:linear-gradient(#1b2530f0,#0b1218f5);border:.5cqw solid #ffffff26;box-shadow:0 -1cqw 3cqw #0007}
.card{position:relative;display:flex;align-items:center;gap:.6cqw;height:14.6cqw;padding:.6cqw 1cqw .6cqw .4cqw;border-radius:2.8cqw;border:.6cqw solid var(--c);background:linear-gradient(140deg,var(--c2),#0b1a12 95%);box-shadow:0 .8cqw 1.6cqw #0008,inset 0 .35cqw 0 #ffffff40;touch-action:none;text-align:left;min-width:0;transition:transform .12s,filter .2s}
.card .ic{width:8.2cqw;height:8.2cqw;object-fit:contain;flex:none;margin-left:-.6cqw;filter:drop-shadow(0 .5cqw .5cqw #0007);pointer-events:none}
.card .tx{min-width:0;flex:1;pointer-events:none}
.card .nm{font-weight:900;font-size:2.55cqw;line-height:1.05;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .3cqw .3cqw #0009}
.card .pr{display:flex;align-items:center;gap:.7cqw;font-weight:1000;font-size:3.9cqw;margin-top:.8cqw;text-shadow:0 .3cqw .3cqw #0009}
.card .pr .coin{width:3.8cqw;height:3.8cqw;border-width:.35cqw}
.card.off{filter:grayscale(.8) brightness(.65)}
.card.armed{transform:translateY(-1.6cqw);box-shadow:0 0 0 .6cqw #fff,0 0 5cqw var(--c)}
.card:active{transform:translateY(.4cqw)}
.pea{--c:#58e05a;--c2:#2a8a2e}.ice{--c:#4fb8ff;--c2:#1d63b8}.bomb{--c:#ff5a5a;--c2:#9e1f2a}.sun{--c:#ffd34a;--c2:#b07a0c}
/* lançador compacto (posicionado pelo JS sobre o bolso 3D) */
#launch{position:absolute;z-index:6;width:15cqw;height:15cqw;margin:-7.5cqw 0 0 -7.5cqw;border-radius:50%;touch-action:none;display:grid;place-items:center;
  background:conic-gradient(#ffe27a calc(var(--p,0)*1%),#0000 0),radial-gradient(circle at 40% 30%,#ffe9a0,#f0b02a 60%,#a86d0c);padding:1cqw;border:.6cqw solid #e9eef2;box-shadow:0 1cqw 2.4cqw #000a}
#launch i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffe9a0,#f0b02a 60%,#a86d0c)}
#launch svg{width:58%;filter:drop-shadow(0 .4cqw .3cqw #0009)}
#launch:not(.ready){filter:grayscale(.6) brightness(.75)}
#launch.ready{animation:lp 1.2s ease-in-out infinite}
@keyframes lp{50%{box-shadow:0 1cqw 2.4cqw #000a,0 0 5cqw #ffcc33}}
/* zonas de vidro das alavancas (visuais; o toque vale em cada metade da tela) */
.gz{position:absolute;z-index:3;pointer-events:none;bottom:calc(env(safe-area-inset-bottom) + 20.5cqw);width:33cqw;height:24cqw;border-radius:5cqw;
  background:linear-gradient(160deg,#ffffff24,#ffffff08 60%,#ffffff14);border:.45cqw solid #ffffff3a;box-shadow:inset 0 .4cqw 0 #ffffff30;backdrop-filter:blur(1.5px);transition:background .08s,box-shadow .08s;display:grid;place-items:center}
.gz svg{width:9cqw;opacity:.55}
#gzL{left:1.4cqw}#gzR{right:1.4cqw}
.gz.on{background:linear-gradient(160deg,#fff6,#ffffff22);box-shadow:0 0 5cqw #ffe27a99,inset 0 0 3cqw #fff8;border-color:#fff}
/* pop do Felipe */
#pop{position:absolute;z-index:7;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);display:flex;align-items:center;gap:1.5cqw;pointer-events:none;opacity:0}
#pop img{width:22cqw;height:22cqw;border-radius:50%;border:.8cqw solid #fff;box-shadow:0 1cqw 3cqw #000a;background:#f0a}
#pop b{display:block;padding:1cqw 3.4cqw;border-radius:3.5cqw;background:linear-gradient(#ffe34a,#ff9b0a);border:.7cqw solid #7a3a00;color:#7a1a00;font-size:9cqw;font-weight:1000;transform:rotate(-6deg);text-shadow:0 .5cqw 0 #ffffff88;box-shadow:0 1cqw 2.4cqw #0009}
#pop.go{animation:pop 1.15s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-8deg)}16%{opacity:1;transform:translate(-50%,-50%) scale(1.12) rotate(2deg)}28%{transform:translate(-50%,-50%) scale(.96)}72%{opacity:1;transform:translate(-50%,-62%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
.fl{position:absolute;z-index:6;pointer-events:none;font-weight:1000;font-size:6cqw;text-shadow:0 .5cqw 0 #000a,0 0 2cqw #000;transform:translate(-50%,-50%);animation:fl 1s ease-out forwards;white-space:nowrap}
.fl.big{font-size:8.4cqw}
@keyframes fl{0%{opacity:0;margin-top:0;scale:.5}15%{opacity:1;scale:1.2}100%{opacity:0;margin-top:-12cqw;scale:1}}
#vig{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 55%,#ff000000 40%,#ff1a1ab0 100%);transition:opacity .5s}
#vig.on{opacity:1;transition:none}
#toast{position:absolute;z-index:30;left:50%;bottom:48cqw;transform:translateX(-50%);padding:2cqw 5cqw;border-radius:4cqw;background:#000c;font-weight:800;font-size:3.8cqw;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap}
#toast.on{opacity:1}
#banner{position:absolute;z-index:8;left:0;right:0;top:36%;text-align:center;pointer-events:none;opacity:0}
#banner b{display:inline-block;font-size:11cqw;font-weight:1000;color:#ffe46c;text-shadow:0 1cqw 0 #8a4f1b,0 2cqw 3cqw #000a;-webkit-text-stroke:.5cqw #5a3205;letter-spacing:.02em}
#banner small{display:block;margin-top:1cqw;font-size:4.2cqw;font-weight:800;text-shadow:0 .4cqw .8cqw #000}
#banner.go{animation:ban 2.2s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.08)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
/* telas */
.screen{position:absolute;inset:0;z-index:20;display:none}
.screen.on{display:block}
#menu{background:#58b3e8 url(assets/ui/menu.webp) center/100% 100% no-repeat}
.hot{position:absolute;border-radius:5cqw;background:transparent}
.hot:active{background:#ffffff33}
#hJogar{left:19%;top:66%;width:62%;height:12.5%}
#hPers{left:8%;top:79.5%;width:27.5%;height:11%}
#hCen{left:36%;top:79.5%;width:28%;height:11%}
#hSom{left:65%;top:79.5%;width:27.5%;height:11%}
#menuBest{position:absolute;left:0;right:0;top:61.2%;text-align:center;font-weight:900;font-size:3.6cqw;text-shadow:0 .4cqw .8cqw #000,0 0 2cqw #000}
.modalbg{background:#031008e8;overflow-y:auto}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88cqw;max-height:92cqh;overflow:auto;border-radius:6cqw;background:linear-gradient(#1f3a2a,#0f2318);border:.8cqw solid #7dff9a55;padding:5cqw;text-align:center;box-shadow:0 2cqw 8cqw #000c}
.box h2{margin:0 0 2.5cqw;font-size:8cqw;font-weight:1000;color:#ffe46c;text-shadow:0 .6cqw 0 #6b3a05;line-height:1}
.box p{margin:1cqw 0 3cqw;font-size:4cqw;line-height:1.4;color:#e5f5ea}
.btn{display:block;width:100%;border-radius:4cqw;padding:3.6cqw 2cqw;margin-top:2.4cqw;font-weight:1000;font-size:5.2cqw;letter-spacing:.03em;background:linear-gradient(#ffe677,#f5a923);color:#3a2500;box-shadow:0 1cqw 0 #8a591b,0 2cqw 3cqw #0007}
.btn:active{transform:translateY(.8cqw);box-shadow:0 .2cqw 0 #8a591b}
.btn.g{background:#ffffff1c;color:#fff;box-shadow:none;border:.4cqw solid #ffffff40;font-size:4.2cqw;padding:3cqw}
.stars{font-size:11cqw;letter-spacing:1cqw;color:#ffd24a;text-shadow:0 .6cqw 0 #6b3a05}
.stars s{color:#ffffff30;text-decoration:none}
.lv{display:flex;gap:3cqw;align-items:center;width:100%;text-align:left;padding:2.4cqw;border-radius:4cqw;background:#ffffff12;border:.5cqw solid #ffffff2e;margin-top:2.4cqw}
.lv img{width:20cqw;height:27cqw;object-fit:cover;object-position:top;border-radius:2.4cqw;flex:none}
.lv b{display:block;font-size:4.8cqw}
.lv small{display:block;font-size:3.3cqw;color:#cfe7d6;margin-top:.8cqw;line-height:1.3}
.lv .st{font-size:5cqw;color:#ffd24a;margin-top:1cqw}
.lv.lock{filter:grayscale(1) brightness(.6);pointer-events:none}
#chars img.sheet{width:100%;border-radius:3cqw;margin-bottom:2cqw}
#noGL{display:none;position:absolute;inset:0;z-index:50;place-items:center;text-align:center;padding:8cqw;background:#06140b;font-weight:800;line-height:1.5}
@media(prefers-reduced-motion:reduce){#pop.go,#banner.go,.fl{animation-duration:.01s}}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="Mesa de pinball 3D"></canvas>
  <div id="touch"></div>
  <div id="vig"></div>
  <div class="hud" id="hudL"><div id="avatar"><img id="face" alt="Felipe" src="assets/felipe/feliz.webp"></div>
    <div id="panelL"><div id="hearts"></div><div id="coinrow"><span class="coin"></span><span id="coins">0</span></div></div></div>
  <div class="hud" id="hudR"><div id="panelR"><svg id="skull" viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="52" rx="10" fill="#4fd05a" stroke="#1c5a24" stroke-width="4"/><rect x="16" y="22" width="10" height="10" fill="#0d2a12"/><rect x="38" y="22" width="10" height="10" fill="#0d2a12"/><rect x="24" y="42" width="16" height="8" fill="#0d2a12"/></svg>
    <div class="mid"><div id="waveTxt">ONDA<b id="waveN">1</b></div><div id="bar"><div id="barf"></div></div><div id="zcount">ZUMBIS 0/0</div></div></div>
    <button id="pauseBtn" aria-label="Pausar" style="pointer-events:auto"><span><i></i><i></i></span></button></div>
  <div id="status"><div id="goldTag">SEMENTE DOURADA ×2</div><div id="comboTag" style="display:none">COMBO <b id="comboN">0</b>/5</div></div>
  <div class="gz" id="gzL"><svg viewBox="0 0 40 40"><path d="M8 30 L30 12" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="8" cy="30" r="5" fill="#fff"/></svg></div>
  <div class="gz" id="gzR"><svg viewBox="0 0 40 40"><path d="M32 30 L10 12" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="32" cy="30" r="5" fill="#fff"/></svg></div>
  <button id="launch" class="ready" aria-label="Lançar a bola: segure e solte"><i><svg viewBox="0 0 40 50"><path d="M20 4 L36 26 H26 V46 H14 V26 H4 Z" fill="#fff6c8" stroke="#7a4a00" stroke-width="3" stroke-linejoin="round"/></svg></i></button>
  <div id="footer"></div>
  <div id="pop"><img id="popImg" alt=""><b id="popTxt">UPIII!</b></div>
  <div id="banner"><b id="banTxt"></b><small id="banSub"></small></div>
  <div id="toast"></div>

  <section class="screen on" id="menu" aria-label="Menu principal">
    <div id="menuBest"></div>
    <button class="hot" id="hJogar" aria-label="Jogar"></button><button class="hot" id="hPers" aria-label="Personagens"></button>
    <button class="hot" id="hCen" aria-label="Cenários"></button><button class="hot" id="hSom" aria-label="Som"></button>
  </section>
  <section class="screen modalbg" id="levels"><div class="box"><h2>Cenários</h2><div id="lvList"></div><button class="btn g" data-go="menu">Voltar</button></div></section>
  <section class="screen modalbg" id="chars"><div class="box"><h2>Personagens</h2><img class="sheet" src="assets/ui/personagens.webp" alt="Guia dos personagens"><button class="btn g" data-go="menu">Voltar</button></div></section>
  <section class="screen modalbg" id="pause"><div class="box"><h2>Pausado</h2><button class="btn" id="bResume">CONTINUAR</button><button class="btn g" id="bRestart">Reiniciar fase</button><button class="btn g" id="bQuit">Sair para o menu</button></div></section>
  <section class="screen modalbg" id="result"><div class="box"><h2 id="resTitle"></h2><div class="stars" id="resStars"></div><p id="resTxt"></p><button class="btn" id="resMain"></button><button class="btn g" id="resMenu">Menu</button></div></section>
  <div id="noGL"><div>Este aparelho ou navegador não conseguiu abrir o 3D (WebGL).<br>Tente atualizar o navegador ou abrir no Chrome.</div></div>
</div>
<script src="game.js"></script>
</body>
</html>
